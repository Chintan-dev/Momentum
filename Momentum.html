<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentum — Habit Tracker</title>
<meta name="description" content="Premium offline habit &amp; task tracker. All data stays on your device.">
<meta name="theme-color" content="#0A0C11">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momentum">
<link id="favicon" rel="icon">
<link id="manifest" rel="manifest">
<style>
/* ================= TOKENS ================= */
:root{
  --accent:#7C5CFF; --accentRGB:124,92,255; --accent2:#4DA6FF;
  --bg:#0A0C11; --bg2:#0E1119; --card:#141926; --card2:#1B2231; --card3:#222b3d;
  --text:#EAEEF7; --text2:#B4BDD0; --muted:#7D879C;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.16);
  --good:#33D69F; --warn:#FFB020; --bad:#FF5C7A; --info:#4DA6FF;
  --r:20px; --r2:14px; --r3:10px;
  --sh:0 12px 34px rgba(0,0,0,.42);
  --sh2:0 4px 14px rgba(0,0,0,.28);
  --ease:cubic-bezier(.22,1,.36,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
html[data-theme="light"]{
  --bg:#F4F6FB; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F3F5FA; --card3:#E9EDF6;
  --text:#141A26; --text2:#414B60; --muted:#7B8598;
  --line:rgba(16,24,40,.09); --line2:rgba(16,24,40,.2);
  --sh:0 12px 30px rgba(16,24,40,.09);
  --sh2:0 3px 10px rgba(16,24,40,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-variant-numeric:tabular-nums;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(720px 460px at 8% -6%, rgba(var(--accentRGB),.20), transparent 62%),
    radial-gradient(620px 420px at 96% 4%, rgba(77,166,255,.13), transparent 60%),
    radial-gradient(560px 380px at 60% 104%, rgba(51,214,159,.08), transparent 62%);
}
html[data-theme="light"] body::before{opacity:.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(var(--accentRGB),.35)}
.hide{display:none !important}

/* ================= SHELL ================= */
#app{position:relative;z-index:1;display:flex;height:100vh;height:100dvh}
.sidebar{
  width:246px;flex:0 0 246px;background:rgba(255,255,255,.02);backdrop-filter:blur(14px);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:20px 12px calc(14px + var(--sab));
}
html[data-theme="light"] .sidebar{background:rgba(255,255,255,.66)}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 18px}
.brand .logo{
  width:36px;height:36px;border-radius:11px;flex:0 0 36px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(var(--accentRGB),.4);
}
.brand .logo svg{width:20px;height:20px;color:#fff}
.brand b{font-size:16.5px;letter-spacing:-.3px;font-weight:700;display:block}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.3px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
.nav .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);padding:14px 12px 6px;font-weight:700}
.nav button{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
  color:var(--text2);font-weight:550;font-size:14.5px;transition:.18s var(--ease);width:100%;text-align:left;position:relative;
}
.nav button svg{width:19px;height:19px;flex:0 0 19px;opacity:.85}
.nav button:hover{background:var(--card2);color:var(--text)}
.nav button.on{background:rgba(var(--accentRGB),.15);color:var(--text);font-weight:650}
.nav button.on svg{color:var(--accent);opacity:1}
.nav button.on::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;min-width:20px;text-align:center}
.sidefoot{padding:12px 8px 0;border-top:1px solid var(--line);margin-top:8px}
.streakbox{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:14px;background:linear-gradient(135deg,rgba(255,176,32,.16),rgba(255,92,122,.1));border:1px solid rgba(255,176,32,.22)}
.streakbox .f{font-size:20px;line-height:1}
.streakbox b{font-size:16px;display:block;line-height:1.15}
.streakbox span{font-size:11px;color:var(--muted)}

main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{
  min-height:62px;display:flex;align-items:center;gap:12px;padding:10px 24px;
  border-bottom:1px solid var(--line);background:rgba(10,12,17,.55);backdrop-filter:blur(16px);
  z-index:20;padding-top:calc(10px + var(--sat));
}
html[data-theme="light"] .topbar{background:rgba(255,255,255,.72)}
.topbar h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.4px}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.sp{flex:1}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 24px calc(44px + var(--sab));-webkit-overflow-scrolling:touch}
.wrap{max-width:1140px;margin:0 auto}
.view{animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ================= BUTTONS ================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:12px;
  background:var(--card2);border:1px solid var(--line);color:var(--text);font-weight:600;font-size:14px;
  transition:.16s var(--ease);white-space:nowrap;
}
.btn:hover{background:var(--card3);border-color:var(--line2);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn svg{width:17px;height:17px}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(var(--accentRGB),.34)}
.btn.pri:hover{box-shadow:0 9px 24px rgba(var(--accentRGB),.46);filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--card2)}
.btn.danger{color:var(--bad);border-color:rgba(255,92,122,.3)}
.btn.danger:hover{background:rgba(255,92,122,.12)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.icon{padding:8px;width:36px;height:36px;border-radius:11px}
.btn.icon.sm{width:30px;height:30px;padding:5px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ================= CARDS ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh2)}
.grid{display:grid;gap:14px}
.sect{margin-bottom:24px}
.sect-h{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.sect-h h2{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.sect-h .c{color:var(--muted);font-size:12.5px;font-weight:600;background:var(--card2);padding:2px 9px;border-radius:99px}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .e{font-size:38px;margin-bottom:10px;opacity:.85}
.empty h3{margin:0 0 5px;color:var(--text2);font-size:15px}
.empty p{margin:0 auto 14px;font-size:13.5px;max-width:340px}
.banner{
  display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:var(--r2);margin-bottom:18px;
  background:linear-gradient(135deg,rgba(255,176,32,.14),rgba(255,92,122,.08));border:1px solid rgba(255,176,32,.3);
}
.banner .bi{font-size:20px;line-height:1}
.banner b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.banner span{display:block;font-size:12.6px;color:var(--text2);line-height:1.5}
.meter{height:8px;border-radius:99px;background:var(--card3);overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--good),var(--warn) 70%,var(--bad));transition:width .5s var(--ease)}

/* ================= HERO ================= */
.hero{
  display:flex;align-items:center;gap:26px;padding:24px 26px;border-radius:24px;margin-bottom:20px;
  background:linear-gradient(135deg,rgba(var(--accentRGB),.17),rgba(77,166,255,.06) 55%,transparent),var(--card);
  border:1px solid var(--line);box-shadow:var(--sh);position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(var(--accentRGB),.2),transparent 68%)}
.ring{position:relative;flex:0 0 126px;width:126px;height:126px}
.ring svg{transform:rotate(-90deg);width:126px;height:126px}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rt b{font-size:29px;font-weight:750;letter-spacing:-1px;line-height:1}
.ring .rt span{font-size:10.5px;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;font-weight:650;display:block;margin-top:3px}
.hero .hi{flex:1;min-width:0;position:relative;z-index:1}
.hero .hi h2{margin:0 0 5px;font-size:25px;font-weight:750;letter-spacing:-.7px}
.hero .hi p{margin:0 0 14px;color:var(--text2);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text2)}
html[data-theme="light"] .chip{background:var(--card2)}
.chip b{color:var(--text);font-weight:700}

/* ================= HABIT ROW ================= */
.hrow{
  display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:var(--r2);
  background:var(--card);border:1px solid var(--line);transition:.18s var(--ease);position:relative;overflow:hidden;
}
.hrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hc,var(--accent));opacity:.9}
.hrow:hover{border-color:var(--line2);box-shadow:var(--sh2);transform:translateX(2px)}
.hrow.done{background:linear-gradient(90deg,rgba(51,214,159,.09),transparent 45%),var(--card)}
.hrow.done .hn{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(125,135,156,.5)}
.hico{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;font-size:20px;cursor:pointer;
  background:var(--hcs);border:1px solid var(--hcb);
}
.hmid{flex:1;min-width:0;cursor:pointer}
.hn{font-weight:650;font-size:14.8px;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hs .dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5}
.tick{
  width:32px;height:32px;flex:0 0 32px;border-radius:50%;border:2px solid var(--line2);
  display:grid;place-items:center;transition:.22s var(--ease);background:transparent;
}
.tick svg{width:17px;height:17px;color:#fff;opacity:0;transform:scale(.4);transition:.22s var(--ease)}
.tick:hover{border-color:var(--hc,var(--accent));transform:scale(1.09)}
.tick.on{background:var(--hc,var(--accent));border-color:var(--hc,var(--accent))}
.tick.on svg{opacity:1;transform:scale(1)}
.counter{display:flex;align-items:center;gap:3px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px}
.counter button{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--text2);font-size:15px;font-weight:700;transition:.14s;line-height:1}
.counter button:hover{background:var(--card3);color:var(--text)}
.counter .v{min-width:56px;text-align:center;font-size:13px;font-weight:700}
.counter .v small{color:var(--muted);font-weight:600}
.week{display:flex;gap:4px}
.week i{width:15px;height:15px;border-radius:5px;background:var(--card3);display:block;transition:.2s;position:relative}
.week i.f{background:var(--hc,var(--accent))}
.week i.p{background:var(--hc,var(--accent));opacity:.45}
.week i.t{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--line2)}
.week i.na{opacity:.25}

/* ================= HABIT CARD ================= */
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:14px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:.2s var(--ease);position:relative;overflow:hidden;box-shadow:var(--sh2)}
.hcard::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--hc),transparent)}
.hcard:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--line2)}
.hcard .top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.hcard .nm{font-weight:700;font-size:15.5px;letter-spacing:-.2px;cursor:pointer}
.hcard .mt{font-size:11.5px;color:var(--muted);margin-top:2px}
.hcard .stats{display:flex;gap:14px;margin:12px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.hcard .st b{display:block;font-size:17px;font-weight:750;letter-spacing:-.4px;line-height:1.2}
.hcard .st span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:650}
.bar{height:6px;border-radius:99px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--hc,var(--accent)),var(--accent2));transition:width .5s var(--ease)}
.menu-wrap{position:relative;margin-left:auto}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card2);border:1px solid var(--line2);border-radius:13px;padding:5px;min-width:158px;box-shadow:var(--sh);z-index:60;animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:550;color:var(--text2)}
.menu button:hover{background:var(--card3);color:var(--text)}
.menu button.d{color:var(--bad)}
.menu button svg{width:16px;height:16px}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 6px}

/* ================= TASKS ================= */
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:16px;overflow-x:auto}
.tabs button{padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.16s;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--card3);color:var(--text);box-shadow:var(--sh2)}
.tabs button .n{opacity:.65;font-size:12px;margin-left:4px}
.addrow{display:flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:8px 8px 8px 14px;margin-bottom:14px;transition:.18s;box-shadow:var(--sh2)}
.addrow:focus-within{border-color:rgba(var(--accentRGB),.5);box-shadow:0 0 0 3px rgba(var(--accentRGB),.13)}
.addrow input[type=text]{flex:1;background:none;border:none;outline:none;font-size:14.5px;min-width:0}
.addrow input::placeholder{color:var(--muted)}
.trow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r2);background:var(--card);border:1px solid var(--line);transition:.18s var(--ease);margin-bottom:8px}
.trow:hover{border-color:var(--line2);transform:translateX(2px)}
.trow.done{opacity:.55}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.cb{width:21px;height:21px;flex:0 0 21px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;transition:.18s var(--ease)}
.cb svg{width:13px;height:13px;color:#fff;opacity:0;transform:scale(.4);transition:.18s var(--ease)}
.cb:hover{border-color:var(--accent);transform:scale(1.1)}
.cb.on{background:var(--good);border-color:var(--good)}
.cb.on svg{opacity:1;transform:scale(1)}
.tt{font-size:14.5px;font-weight:550;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.pill{font-size:11px;font-weight:650;padding:2.5px 8px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.pill.p1{background:rgba(255,92,122,.15);color:#ff8ca2;border-color:rgba(255,92,122,.25)}
.pill.p2{background:rgba(255,176,32,.15);color:#ffc862;border-color:rgba(255,176,32,.25)}
.pill.p3{background:rgba(77,166,255,.14);color:#7cc0ff;border-color:rgba(77,166,255,.24)}
.pill.tag{background:var(--card3);color:var(--text2)}
.pill.due{background:var(--card3);color:var(--text2)}
.pill.due.over{background:rgba(255,92,122,.16);color:#ff8ca2}
.pill.due.today{background:rgba(51,214,159,.15);color:#5ee3b6}
html[data-theme="light"] .pill.p1{color:#c92a4e}
html[data-theme="light"] .pill.p2{color:#a06400}
html[data-theme="light"] .pill.p3{color:#0b62b8}
html[data-theme="light"] .pill.due.over{color:#c92a4e}
html[data-theme="light"] .pill.due.today{color:#0d8a63}
.daygroup{margin-bottom:18px}
.daygroup h3{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 9px 3px;text-transform:uppercase;letter-spacing:.7px}

/* ================= STATS ================= */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.tile .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;margin-bottom:11px;font-size:16px}
.tile b{font-size:26px;font-weight:750;letter-spacing:-1px;display:block;line-height:1.1}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.tile .tr{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
.tr.up{background:rgba(51,214,159,.15);color:#5ee3b6}
.tr.dn{background:rgba(255,92,122,.15);color:#ff8ca2}
.hm{display:flex;gap:3px;overflow-x:auto;padding:4px 0 8px}
.hm .col{display:flex;flex-direction:column;gap:3px}
.hm .cell{width:13px;height:13px;border-radius:3.5px;background:var(--card3);transition:.15s;cursor:default}
.hm .cell:hover{outline:1.5px solid var(--line2);transform:scale(1.2)}
.hm .cell.o{outline:1.5px solid var(--accent)}
.hmlegend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);justify-content:flex-end;margin-top:2px}
.hmlegend i{width:12px;height:12px;border-radius:3.5px;display:block}
.hmdays{display:flex;flex-direction:column;gap:3px;font-size:9.5px;color:var(--muted);margin-right:5px;padding-top:0}
.hmdays span{height:13px;line-height:13px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.lb{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.lb .n{width:132px;flex:0 0 132px;font-size:13.3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.lb .b{flex:1}
.lb .p{width:44px;text-align:right;font-size:12.5px;font-weight:700;color:var(--text2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ================= FORMS ================= */
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:650;color:var(--text2);margin-bottom:6px;letter-spacing:.1px}
.inp{
  width:100%;padding:11px 13px;border-radius:12px;background:var(--card2);

select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237D879C' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px}
.row{display:flex;gap:11px}
.row>*{flex:1;min-width:0}
.picker{display:flex;gap:7px;flex-wrap:wrap}
.picker button{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;
  background:var(--card2);border:1px solid var(--line);transition:.14s var(--ease);
}
.picker button:hover{transform:scale(1.1);border-color:var(--line2)}
.picker button.on{border-color:var(--accent);background:rgba(var(--accentRGB),.16);box-shadow:0 0 0 2px rgba(var(--accentRGB),.2)}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;transition:.14s var(--ease);position:relative}
.swatch:hover{transform:scale(1.14)}
.swatch.on{box-shadow:0 0 0 2.5px var(--card),0 0 0 4.5px currentColor}
.days{display:flex;gap:6px}
.days button{flex:1;padding:9px 0;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:650;color:var(--text2);transition:.14s}
.days button.on{background:rgba(var(--accentRGB),.18);border-color:var(--accent);color:var(--text)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-size:13.2px;font-weight:600;color:var(--muted);transition:.16s}
.seg button.on{background:var(--card3);color:var(--text);box-shadow:var(--sh2)}
.switch{width:44px;height:25px;border-radius:99px;background:var(--card3);position:relative;transition:.22s var(--ease);flex:0 0 44px;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;top:2.5px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.22s var(--ease)}
.switch.on{background:var(--accent);border-color:transparent}
.switch.on::after{transform:translateX(19px);background:#fff}
.srow{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.srow .t{flex:1;min-width:0}
.srow .t b{font-size:14px;font-weight:600;display:block}
.srow .t span{font-size:12.3px;color:var(--muted);display:block;margin-top:1px}

/* ================= MODAL ================= */
.ov{position:fixed;inset:0;background:rgba(5,7,12,.66);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s ease}
.modal{
  background:var(--bg2);border:1px solid var(--line2);border-radius:24px;width:100%;max-width:520px;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:up .28s var(--ease);
}
@keyframes up{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.modal.wide{max-width:660px}
.mh{display:flex;align-items:center;gap:12px;padding:19px 22px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:17.5px;font-weight:700;letter-spacing:-.3px;flex:1}
.mb{padding:20px 22px;overflow-y:auto;flex:1}
.mf{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}

.toast{
  background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:11px 18px;

.toast.ok{border-color:rgba(51,214,159,.4)}
.toast.err{border-color:rgba(255,92,122,.4)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:500}
.fab{display:none}
.tabbar{display:none}
.moods{display:flex;gap:8px;flex-wrap:wrap}

<script>

  copy:'<rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.5"/>',
  play:'<path d="M6 4l14 8-14 8z" fill="currentColor" stroke-linejoin="round"/>',
  pause:'<rect x="6.5" y="4.5" width="4" height="15" rx="1.4" fill="currentColor"/><rect x="13.5" y="4.5" width="4" height="15" rx="1.4" fill="currentColor"/>',
  reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',

};
const ic = (n,w) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||2)+'" stroke-linecap="round" stroke-linejoin="round">'+(P[n]||'')+'</svg>';

/* ---------- palette ---------- */
const COLORS = [
  {id:'violet', hex:'#7C5CFF', rgb:'124,92,255'},
  {id:'blue',   hex:'#4DA6FF', rgb:'77,166,255'},
  {id:'cyan',   hex:'#22D3EE', rgb:'34,211,238'},
  {id:'teal',   hex:'#2DD4BF', rgb:'45,212,191'},
  {id:'green',  hex:'#33D69F', rgb:'51,214,159'},
  {id:'lime',   hex:'#A3E635', rgb:'163,230,53'},
  {id:'amber',  hex:'#FFB020', rgb:'255,176,32'},
  {id:'orange', hex:'#FF8A3D', rgb:'255,138,61'},
  {id:'red',    hex:'#FF5C7A', rgb:'255,92,122'},
  {id:'pink',   hex:'#F472B6', rgb:'244,114,182'},
  {id:'purple', hex:'#A855F7', rgb:'168,85,247'},
  {id:'slate',  hex:'#94A3B8', rgb:'148,163,184'}
];
const col = id => COLORS.find(c => c.id === id) || COLORS[0];
const EMOJI = ['✅','💪','🏃','🧘','📚','💧','🌙','☀️','🍎','🥗','💊','🦷','🧹','💰','💻','✍️','🎨','🎸','🧠','📵','🚭','🙏','❤️','🐕','☎️','🛏️','🚿','🥇','🔥','⚡','🌱','🎯'];
const CATS = ['Health','Fitness','Mind','Work','Study','Home','Money','Social','Creative','Other'];

/* ---------- date utils ---------- */
const pad = n => String(n).padStart(2,'0');
const dk = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const today0 = () => midnight(new Date());
const TODAY = () => dk(new Date());
const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const DAYN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function weekStartOf(d){
  const ws = S.settings.weekStart|0;
  const x = midnight(d); const diff = (x.getDay() - ws + 7) % 7;
  return addD(x, -diff);
}
function fmtDay(k){
  const d = pd(k), t = TODAY();
  if(k === t) return 'Today';
  if(k === dk(addD(today0(),-1))) return 'Yesterday';
  if(k === dk(addD(today0(),1))) return 'Tomorrow';
  return DAYN[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate();
}
function fmtLong(d){ return DAYN[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));

/* =========================================================
   LOCAL STORAGE LAYER
   Every byte of this app lives in this browser's localStorage.
   Nothing is ever sent anywhere. This layer makes that safe:
     · probes storage up-front, falls back to memory if blocked
     · normalises + migrates whatever it reads back
     · keeps a rolling daily backup it can self-heal from
     · survives quota errors and corrupt records
   ========================================================= */
const KEY    = 'momentum.v1';         // the data
const UIKEY  = 'momentum.ui.v1';      // where you were: view, filters, running timer
const BAKKEY = 'momentum.v1.backup';  // yesterday's known-good copy
const DEFAULTS = {
  habits: [], logs: {}, tasks: [], notes: {}, focus: [],
  settings: { name:'', theme:'dark', accent:'violet', weekStart:1, notify:false, sound:true, confetti:true },
  meta: { created: Date.now(), v: 1 }
};

/* Storage handle. If localStorage is blocked (private window, file:// with
   site-data disabled, quota of zero) we transparently swap in a memory store
   so the whole app still runs — it just cannot persist, and says so loudly. */
const DB = (function(){
  const mem = Object.create(null);
  const memStore = {
    ok:false, reason:'',
    getItem: k => (k in mem ? mem[k] : null),
    setItem: (k,v) => { mem[k] = String(v); },
    removeItem: k => { delete mem[k]; },
    keys: () => Object.keys(mem)
  };
  try{
    if(typeof localStorage === 'undefined' || !localStorage) throw new Error('not available');
    const probe = '__momentum_probe__';
    localStorage.setItem(probe, 'ok');
    if(localStorage.getItem(probe) !== 'ok') throw new Error('write did not read back');
    localStorage.removeItem(probe);
    return {
      ok:true, reason:'',
      getItem: k => localStorage.getItem(k),
      setItem: (k,v) => localStorage.setItem(k,v),
      removeItem: k => localStorage.removeItem(k),
      keys: () => { try{ return Object.keys(localStorage); }catch(e){ return []; } }
    };
  }catch(e){
    memStore.reason = (e && e.name === 'SecurityError')
      ? 'the browser is blocking site data here (private window, or third-party/site-data settings)'
      : ((e && e.message) || 'unavailable');
    return memStore;
  }
})();
let bootNotice = '';      // shown once after boot if something needed saying
let storageError = false; // true after a failed write, until one succeeds

/* Repair anything missing or malformed, so an old or hand-edited backup
   can never crash a render. */
function normalize(d){
  const s = Object.assign(structuredClone(DEFAULTS), d || {});
  s.settings = Object.assign(structuredClone(DEFAULTS.settings), (d && d.settings) || {});
  s.meta = Object.assign({ created: Date.now(), v: 1 }, (d && d.meta) || {});
  if(!Array.isArray(s.habits)) s.habits = [];
  if(!Array.isArray(s.tasks))  s.tasks  = [];
  if(!Array.isArray(s.focus))  s.focus  = [];
  if(!s.logs  || typeof s.logs  !== 'object') s.logs  = {};
  if(!s.notes || typeof s.notes !== 'object') s.notes = {};

  s.habits = s.habits.filter(h => h && h.id && h.name).map(h => {
    const f = (h.freq && typeof h.freq === 'object') ? h.freq : { t:'daily' };
    if(!['daily','days','weekly'].includes(f.t)) f.t = 'daily';
    if(f.t === 'days' && !Array.isArray(f.days)) f.days = [1,2,3,4,5];
    if(f.t === 'weekly') f.per = clamp(parseInt(f.per) || 3, 1, 7);
    return Object.assign({ icon:'✅', color:'violet', cat:'Other', type:'check', target:1,
      unit:'', reminder:'', note:'', created:TODAY(), archived:false }, h,
      { freq:f, target: Math.max(1, parseInt(h.target) || 1), archived: !!h.archived });
  });
  s.tasks = s.tasks.filter(t => t && t.id && t.title).map(t =>
    Object.assign({ notes:'', due:'', pri:2, tag:'', done:false, doneAt:'', created:TODAY(), sub:[] }, t,
      { sub: Array.isArray(t.sub) ? t.sub.filter(x => x && typeof x.t === 'string') : [],
        pri: [1,2,3].includes(t.pri) ? t.pri : 2, done: !!t.done }));
  s.focus = s.focus.filter(f => f && f.date && f.min > 0);
  Object.keys(s.logs).forEach(id => {
    if(!s.habits.some(h => h.id === id)) { delete s.logs[id]; return; }   // orphaned logs
    const o = s.logs[id];
    if(!o || typeof o !== 'object'){ delete s.logs[id]; return; }
    Object.keys(o).forEach(k => { const n = Number(o[k]); if(!(n > 0)) delete o[k]; else o[k] = n; });
  });
  Object.keys(s.notes).forEach(k => {
    const n = s.notes[k];
    if(!n || typeof n !== 'object' || (!n.text && !n.mood)) delete s.notes[k];
  });
  s.settings.weekStart = [0,1,6].includes(s.settings.weekStart) ? s.settings.weekStart : 1;
  if(!COLORS.some(c => c.id === s.settings.accent)) s.settings.accent = 'violet';
  if(!['dark','light','system'].includes(s.settings.theme)) s.settings.theme = 'dark';
  return s;
}

function load(){
  if(!DB.ok) bootNotice = 'Running without saved storage — ' + DB.reason + '. Your work stays only until you close this tab, so export a backup before you leave.';
  const raw = DB.getItem(KEY);
  if(!raw) return structuredClone(DEFAULTS);
  try{
    return normalize(JSON.parse(raw));
  }catch(e){
    try{ DB.setItem(KEY + '.corrupt', raw); }catch(_){}          // never throw the damaged copy away
    const bak = DB.getItem(BAKKEY);
    if(bak){
      try{
        const s = normalize(JSON.parse(bak));
        bootNotice = 'The main record was unreadable, so Momentum restored your automatic backup from ' +
          (DB.getItem(BAKKEY + '.date') || 'an earlier day') + '.';
        return s;
      }catch(_){}
    }
    bootNotice = 'Saved data could not be read and no backup was available. The damaged copy is kept under the key momentum.v1.corrupt if you want to recover it by hand.';
    return structuredClone(DEFAULTS);
  }
}

/* ---------- habit maths ---------- */
const goalOf = h => h.type === 'count' ? Math.max(1, h.target||1) : 1;
const getLog = (h,k) => (S.logs[h.id] && S.logs[h.id][k]) || 0;
function setLog(h,k,v){
  if(!S.logs[h.id]) S.logs[h.id] = {};
  if(v > 0) S.logs[h.id][k] = v; else delete S.logs[h.id][k];
  save();
}
const isDone = (h,k) => getLog(h,k) >= goalOf(h);
const ratioOf = (h,k) => clamp(getLog(h,k)/goalOf(h), 0, 1);

function scheduled(h, d){
  const f = h.freq || {t:'daily'};
  if(midnight(d) < pd(h.created)) return false;
  if(f.t === 'days') return (f.days||[]).includes(d.getDay());
  return true; // daily + weekly-target are available every day
}
function weekDone(h, anyDate){
  const ws = weekStartOf(anyDate); let n = 0;
  for(let i=0;i<7;i++){ if(isDone(h, dk(addD(ws,i)))) n++; }
  return n;
}
/* is this habit still expected today? */
function dueToday(h){
  const d = new Date();
  if(h.archived || !scheduled(h,d)) return false;
  const f = h.freq || {t:'daily'};
  if(f.t === 'weekly' && !isDone(h, TODAY())){
    return weekDone(h,d) < (f.per||3);
  }
  return true;
}
function freqLabel(h){
  const f = h.freq || {t:'daily'};
  if(f.t === 'daily') return 'Every day';
  if(f.t === 'weekly') return (f.per||3)+'× per week';
  const ds = (f.days||[]).slice().sort();
  if(ds.length === 7) return 'Every day';
  if(ds.length === 5 && ds.join() === '1,2,3,4,5') return 'Weekdays';
  if(ds.length === 2 && ds.join() === '0,6') return 'Weekends';
  return ds.map(i => DAYN[i]).join(' · ') || 'No days set';
}
function streaks(h){
  const f = h.freq || {t:'daily'};
  const created = pd(h.created);
  let cur = 0, best = 0, run = 0;
  if(f.t === 'weekly'){
    const per = f.per||3;
    let w = weekStartOf(created), now = today0();
    const list = [];
    while(w <= now){ list.push(new Date(w)); w = addD(w,7); }
    list.forEach((ws,i) => {
      const ok = weekDone(h, ws) >= per;
      const last = i === list.length-1;
      if(ok){ run++; best = Math.max(best, run); }
      else if(!last) run = 0;
      else return;
    });
    cur = run;
  } else {
    let d = today0();
    if(scheduled(h,d) && !isDone(h, dk(d))) d = addD(d,-1);
    while(d >= created){
      if(scheduled(h,d)){ if(isDone(h, dk(d))) cur++; else break; }
      d = addD(d,-1);
    }
    let x = new Date(created), n = today0();
    while(x <= n){
      if(scheduled(h,x)){ if(isDone(h, dk(x))){ run++; best = Math.max(best, run); } else run = 0; }
      x = addD(x,1);
    }
    best = Math.max(best, cur);
  }
  return { cur, best };
}
function rate(h, days){
  let due = 0, hit = 0, d = today0();
  for(let i=0;i<days;i++){
    if(scheduled(h,d)){ due++; if(isDone(h, dk(d))) hit++; }
    d = addD(d,-1);
  }
  return due ? hit/due : 0;
}
const totalDone = h => Object.values(S.logs[h.id]||{}).filter(v => v >= goalOf(h)).length;
const activeHabits = () => S.habits.filter(h => !h.archived);
function dayScore(k){
  const d = pd(k);
  const list = S.habits.filter(h => !h.archived && scheduled(h,d));
  if(!list.length) return null;
  let s = 0; list.forEach(h => s += ratioOf(h,k));
  return s/list.length;
}
function perfectStreak(){
  let n = 0, d = today0();
  if(dayScore(dk(d)) !== 1) d = addD(d,-1);
  while(true){
    const s = dayScore(dk(d));
    if(s === 1) n++; else break;
    d = addD(d,-1);
    if(n > 3000) break;
  }
  return n;
}

  if(VIEWS.some(x => x.id === d.view)) V = d.view;

    T.total = t.total; T.preset = t.preset || 25; T.habit = t.habit || ''; T.break = !!t.br;
    if(t.running && t.endAt){
      const left = Math.round((t.endAt - Date.now())/1000);
      if(left > 0){                       // still ticking — pick it right back up
        T.left = left; T.endAt = t.endAt; T.running = true;

      } else {                            // it ran out while the app was closed
        T.left = 0; T.running = false; T.finishedWhileAway = true;

function ring(pctv, size, stroke, color){

    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--card3)" stroke-width="'+stroke+'"/>'

}

/* ---------- heatmap ---------- */
function heatmap(get, weeks, rgb){
  const endW = weekStartOf(new Date()), startW = addD(endW, -7*(weeks-1)), t0 = today0();
  const labels = [];
  for(let i=0;i<7;i++){ const d = (S.settings.weekStart + i) % 7; labels.push(i%2===1 ? DAYN[d] : ''); }
  let cols = '', lastMon = -1, months = '';
  for(let w=0; w<weeks; w++){
    let cells = '';
    const first = addD(startW, w*7);
    months += '<span style="width:16px;display:inline-block;font-size:9.5px;color:var(--muted)">'
      + (first.getMonth() !== lastMon ? (lastMon = first.getMonth(), MON[first.getMonth()]) : '') + '</span>';
    for(let d=0; d<7; d++){
      const day = addD(startW, w*7+d), key = dk(day), future = day > t0;
      const v = future ? null : get(key);
      let style = 'background:var(--card3)';
      if(future) style += ';opacity:.22';
      else if(v != null && v > 0) style = 'background:rgba('+rgb+','+(0.22 + 0.78*v).toFixed(2)+')';
      cells += '<div class="cell'+(key===TODAY()?' o':'')+'" style="'+style+'" title="'+key+' — '+(v==null?'—':Math.round(v*100)+'%')+'"></div>';
    }
    cols += '<div class="col">'+cells+'</div>';
  }
  return '<div style="display:flex;align-items:flex-start">'
    + '<div class="hmdays">'+labels.map(l => '<span>'+l+'</span>').join('')+'</div>'
    + '<div style="flex:1;min-width:0;overflow-x:auto"><div class="hm">'+cols+'</div></div></div>'
    + '<div class="hmlegend">Less <i style="background:var(--card3)"></i><i style="background:rgba('+rgb+',.3)"></i><i style="background:rgba('+rgb+',.55)"></i><i style="background:rgba('+rgb+',.8)"></i><i style="background:rgba('+rgb+',1)"></i> More</div>';
}

/* ---------- habit detail ---------- */
function openHabit(id){
  const h = S.habits.find(x => x.id === id); if(!h) return;
  const c = col(h.color), st = streaks(h);
  const wd = [0,0,0,0,0,0,0], wdT = [0,0,0,0,0,0,0];
  let d = today0(), created = pd(h.created);
  while(d >= created){
    if(scheduled(h,d)){ wdT[d.getDay()]++; if(isDone(h,dk(d))) wd[d.getDay()]++; }
    d = addD(d,-1);
  }
  const wdMax = Math.max(...wd.map((v,i) => wdT[i]?v/wdT[i]:0), .001);
  let bars = '';
  for(let i=0;i<7;i++){
    const idx = (S.settings.weekStart + i) % 7;
    const p = wdT[idx] ? wd[idx]/wdT[idx] : 0;
    bars += '<div class="lb"><div class="n" style="width:52px;flex:0 0 52px">'+DAYN[idx]+'</div>'
      + '<div class="b"><div class="bar"><i style="width:'+(p*100).toFixed(0)+'%"></i></div></div>'
      + '<div class="p">'+Math.round(p*100)+'%</div></div>';
  }
  const body = '<div class="mb">'
    + '<div class="tiles" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">'
      + tile('🔥', st.cur, 'Current streak') + tile('🏆', st.best, 'Longest')
      + tile('📈', Math.round(rate(h,30)*100)+'%', 'Last 30d') + tile('✅', totalDone(h), 'Total done')
    + '</div>'
    + '<div class="sect-h"><h2>Consistency</h2><span class="c">last 26 weeks</span></div>'
    + '<div class="card" style="margin-bottom:18px">'+heatmap(k => scheduled(h,pd(k)) ? ratioOf(h,k) : null, 26, c.rgb)+'</div>'
    + '<div class="sect-h"><h2>By day of week</h2></div>'
    + '<div class="card" style="margin-bottom:18px">'+bars+'</div>'
    + '<div class="sect-h"><h2>Last 14 days</h2></div><div class="card">'+last14(h)+'</div>'
    + (h.note ? '<div class="card" style="margin-top:14px"><div class="mini" style="margin-bottom:5px;font-weight:700">Why this matters</div><div style="font-size:13.8px;color:var(--text2);white-space:pre-wrap">'+esc(h.note)+'</div></div>' : '')
    + '</div>';
  modal('<div class="mh"><div class="hico" style="'+habitStyle(h)+'">'+esc(h.icon||'✅')+'</div>'
    + '<div style="flex:1;min-width:0"><h3>'+esc(h.name)+'</h3><div class="mini">'+freqLabel(h)+(h.cat?' · '+esc(h.cat):'')+'</div></div>'
    + '<button class="x" data-act="close">'+ic('x')+'</button></div>'
    + body
    + '<div class="mf"><button class="btn" data-act="archive" data-id="'+h.id+'">'+ic('archive')+(h.archived?'Restore':'Archive')+'</button>'
    + '<button class="btn pri" data-act="editHabit" data-id="'+h.id+'">'+ic('edit')+'Edit habit</button></div>', true);
}
function tile(emoji, val, label){
  return '<div class="tile"><div class="ic" style="background:var(--card2)">'+emoji+'</div><b>'+val+'</b><span>'+label+'</span></div>';
}
function last14(h){
  let s = '<div style="display:flex;gap:5px;justify-content:space-between">';
  for(let i=13;i>=0;i--){
    const d = addD(today0(),-i), k = dk(d), av = scheduled(h,d), r = ratioOf(h,k);
    const c = col(h.color);
    const bg = !av ? 'var(--card3);opacity:.3' : r>=1 ? c.hex : r>0 ? 'rgba('+c.rgb+',.45)' : 'var(--card3)';
    s += '<div style="flex:1;text-align:center">'

      + '<div style="font-size:9.5px;color:var(--muted);margin-top:5px">'+DAYN[d.getDay()][0]+'</div>'
      + '<div style="font-size:9.5px;color:var(--muted)">'+d.getDate()+'</div></div>';
  }
  return s + '</div>';
}

/* =========================================================
   VIEW: TASKS
   ========================================================= */
const PRI = { 1:{l:'High',c:'p1'}, 2:{l:'Medium',c:'p2'}, 3:{l:'Low',c:'p3'} };
function quickAdd(){
  return '<div class="addrow">'
    + '<input type="text" id="qaTitle" placeholder="Add a task…  try: Pay rent !1 #home tomorrow" autocomplete="off">'
    + '<input type="date" class="inp" id="qaDue" style="width:auto;padding:7px 10px;font-size:13px" value="'+(V==='today'?TODAY():'')+'">'
    + '<button class="btn pri sm" data-act="addTask">'+ic('plus')+'Add</button></div>';
}
function parseTask(raw){
  let s = ' ' + raw + ' ', pri = 0, tag = '', due = '';
  s = s.replace(/\s!([123])\b/g, (m,p) => { pri = +p; return ' '; });
  s = s.replace(/\s#([\w-]+)/g, (m,t) => { tag = t; return ' '; });
  const t0 = today0();
  const rel = { today:0, tod:0, tomorrow:1, tmr:1, tom:1 };
  s = s.replace(/\s(today|tod|tomorrow|tmr|tom)\b/i, (m,w) => { due = dk(addD(t0, rel[w.toLowerCase()])); return ' '; });
  if(!due) s = s.replace(/\sin (\d+) ?d(ays?)?\b/i, (m,n) => { due = dk(addD(t0,+n)); return ' '; });
  if(!due) s = s.replace(/\s(mon|tue|wed|thu|fri|sat|sun)[a-z]*\b/i, (m,w) => {
    const idx = ['sun','mon','tue','wed','thu','fri','sat'].indexOf(w.toLowerCase());
    let n = (idx - t0.getDay() + 7) % 7; if(n === 0) n = 7;
    due = dk(addD(t0,n)); return ' '; });
  return { title: s.replace(/\s+/g,' ').trim(), pri: pri||2, tag, due };
}
function addTaskFromInput(){
  const i = el('qaTitle'); if(!i) return;
  const raw = i.value.trim(); if(!raw){ i.focus(); return; }
  const p = parseTask(raw);
  const dueField = el('qaDue') ? el('qaDue').value : '';
  const t = { id:uid(), title:p.title || raw, notes:'', due: p.due || dueField || '', pri:p.pri, tag:p.tag,
              done:false, doneAt:'', created:TODAY(), sub:[] };
  S.tasks.unshift(t); save(true);
  i.value = ''; render();
  const n = el('qaTitle'); if(n) n.focus();
  toast('Task added', 'ok');
}
function taskRow(t){
  const overdue = t.due && !t.done && t.due < TODAY();
  const isToday = t.due === TODAY();
  const subDone = (t.sub||[]).filter(s => s.d).length;
  let pills = '';
  if(t.tag) pills += '<span class="pill tag">#'+esc(t.tag)+'</span>';
  if((t.sub||[]).length) pills += '<span class="pill tag">'+subDone+'/'+t.sub.length+'</span>';
  if(t.due) pills += '<span class="pill due '+(overdue?'over':(isToday?'today':''))+'">'+(overdue?'⚠ ':'')+fmtDay(t.due)+'</span>';
  if(!t.done && t.pri) pills += '<span class="pill '+PRI[t.pri].c+'">'+PRI[t.pri].l+'</span>';
  return '<div class="trow '+(t.done?'done':'')+'">'
    + '<button class="cb '+(t.done?'on':'')+'" data-act="tdone" data-id="'+t.id+'" aria-label="Complete">'+ic('check',3.4)+'</button>'
    + '<div class="tt" data-act="editTask" data-id="'+t.id+'">'+esc(t.title)+'</div>'
    + pills
    + '<button class="btn icon sm ghost" data-act="delTask" data-id="'+t.id+'" aria-label="Delete">'+ic('trash')+'</button></div>';
}
function viewTasks(){
  const k = TODAY(), open = S.tasks.filter(t => !t.done);
  const counts = {
    today: open.filter(t => t.due && t.due <= k).length,
    upcoming: open.filter(t => t.due && t.due > k).length,
    someday: open.filter(t => !t.due).length,
    all: open.length,
    done: S.tasks.filter(t => t.done).length
  };
  const F = [['today','Today'],['upcoming','Upcoming'],['someday','Someday'],['all','All open'],['done','Completed']];
  let h = '<div class="tabs">' + F.map(([id,l]) =>
      '<button data-act="tfilter" data-f="'+id+'" class="'+(ui.taskFilter===id?'on':'')+'">'+l+'<span class="n">'+counts[id]+'</span></button>').join('') + '</div>';
  h += quickAdd();

  let list;
  if(ui.taskFilter === 'today') list = open.filter(t => t.due && t.due <= k);
  else if(ui.taskFilter === 'upcoming') list = open.filter(t => t.due && t.due > k);
  else if(ui.taskFilter === 'someday') list = open.filter(t => !t.due);
  else if(ui.taskFilter === 'done') list = S.tasks.filter(t => t.done);
  else list = open;

  if(!list.length){
    return h + '<div class="card empty"><div class="e">'+(ui.taskFilter==='done'?'🏁':'✨')+'</div>'
      + '<h3>'+(ui.taskFilter==='done'?'No completed tasks yet':'All clear')+'</h3>'
      + '<p>'+(ui.taskFilter==='done'?'Finished tasks land here so you can see what you shipped.':'Nothing in this list. Add a task above — you can type a priority with !1 and a tag with #work.')+'</p>'
      + '</div>';
  }

  const sortP = (a,b) => (a.pri||2) - (b.pri||2) || (a.created < b.created ? 1 : -1);
  if(ui.taskFilter === 'upcoming'){
    const groups = {};
    list.forEach(t => { (groups[t.due] = groups[t.due] || []).push(t); });
    h += Object.keys(groups).sort().map(d =>
      '<div class="daygroup"><h3>'+fmtDay(d)+'</h3>'+groups[d].sort(sortP).map(taskRow).join('')+'</div>').join('');
  } else if(ui.taskFilter === 'done'){
    const groups = {};
    list.forEach(t => { const d = t.doneAt || t.created || '—'; (groups[d] = groups[d] || []).push(t); });
    h += Object.keys(groups).sort().reverse().slice(0,30).map(d =>
      '<div class="daygroup"><h3>'+(d==='—'?'Earlier':fmtDay(d))+'</h3>'+groups[d].map(taskRow).join('')+'</div>').join('');
    h += '<div style="text-align:center;margin-top:6px"><button class="btn danger sm" data-act="clearDone">'+ic('trash')+'Clear completed</button></div>';
  } else {
    const over = list.filter(t => t.due && t.due < k).sort(sortP);
    const rest = list.filter(t => !(t.due && t.due < k)).sort((a,b) => (a.due||'9999') < (b.due||'9999') ? -1 : (a.due||'9999') > (b.due||'9999') ? 1 : sortP(a,b));
    if(over.length) h += '<div class="daygroup"><h3 style="color:var(--bad)">Overdue</h3>'+over.map(taskRow).join('')+'</div>';
    h += '<div class="daygroup">'+(over.length?'<h3>Scheduled</h3>':'')+rest.map(taskRow).join('')+'</div>';
  }
  return h;
}

function barChart(data, accent){
  const W = 720, H = 168, pb = 24, pt = 12;
  const n = Math.max(1, data.length);
  const gap = n > 40 ? 2 : n > 20 ? 3 : 6;
  const bw = Math.max(2, (W - (n-1)*gap) / n);
  let bars = '', labels = '';
  data.forEach((d,i) => {
    const v = clamp(d.v||0, 0, 1);
    const bh = Math.max(v > 0 ? 4 : 2, v*(H-pb-pt));
    const x = i*(bw+gap), y = H - pb - bh;
    const fill = v >= 1 ? 'url(#gb)' : v > 0 ? 'rgba('+accent+','+(0.35+0.5*v).toFixed(2)+')' : 'var(--card3)';
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="'+Math.min(4,bw/2).toFixed(1)+'" fill="'+fill+'"><title>'+d.title+'</title></rect>';
    if(d.label) labels += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+d.label+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'
    + '<defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>'
    + '<line x1="0" y1="'+(H-pb)+'" x2="'+W+'" y2="'+(H-pb)+'" stroke="var(--line)" stroke-width="1"/>'
    + bars + labels + '</svg>';
}
function viewStats(){

  let perfect = 0, scored = 0, sum = 0;
  for(let i=0;i<R;i++){ const s = dayScore(dk(addD(today0(),-i))); if(s != null){ scored++; sum += s; if(s === 1) perfect++; } }

    + '<div class="card">'+heatmap(k => dayScore(k), 26, A)+'</div></div>';

  if(acts.length){

    h += '<div class="sect"><div class="sect-h"><h2>Habit leaderboard</h2><span class="c">'+R+' days</span></div><div class="card">'
      + ranked.map(x => { const p = rate(x,R), c = col(x.color);

    wdBars += '<div class="lb"><div class="n" style="width:56px;flex:0 0 56px">'+DAYN[x]+'</div><div class="b"><div class="bar"><i style="width:'+(p*100).toFixed(0)+'%"></i></div></div><div class="p">'+Math.round(p*100)+'%</div></div>'; }

  const overdue = S.tasks.filter(t => !t.done && t.due && t.due < TODAY()).length;

      + srow('Journal entries', Object.keys(S.notes).filter(k=>S.notes[k].text||S.notes[k].mood).length)
      + srow('Tracking since', S.habits.length ? fmtDay(S.habits.map(x=>x.created).sort()[0]) : '—')
    + '</div></div>';
  return h;

function paintTimer(){
  const r = el('tRing'); if(!r) return;
  const p = T.total ? 1 - T.left/T.total : 0;
  const m = Math.floor(T.left/60), s = T.left%60;
  r.innerHTML = ring(p, 236, 12, T.break ? '#33D69F' : null)
    + '<div class="rt"><b>'+pad(m)+':'+pad(s)+'</b><span>'+(T.running ? (T.break?'BREAK':'FOCUS') : 'READY')+'</span></div>';
}
function tickTimer(){
  T.left = Math.max(0, Math.round((T.endAt - Date.now())/1000));
  paintTimer();
  if(T.left <= 0){ finishTimer(true); }
}
function startTimer(){
  const sel = el('tHabit'); if(sel) T.habit = sel.value;
  T.running = true; T.endAt = Date.now() + T.left*1000;
  clearInterval(T.tick); T.tick = setInterval(tickTimer, 250);
  render();
}
function pauseTimer(){ T.running = false; clearInterval(T.tick); render(); }
function resetTimer(){ T.running = false; clearInterval(T.tick); T.left = T.total; render(); }
function finishTimer(auto){
  clearInterval(T.tick); T.running = false;
  const spent = Math.round((T.total - T.left)/60);
  if(spent >= 1){
    const now = new Date();
    S.focus.push({ id:uid(), date:TODAY(), at:pad(now.getHours())+':'+pad(now.getMinutes()), min:spent, habit:T.habit||'', break:!!T.break });
    save(true);
    toast(spent+' min logged'+(T.break?' (break)':'')+' 🎧', 'ok');
    if(auto && !T.break){ beep(); if(S.settings.confetti) confetti(); }
  }
  T.left = T.total; render();
}
function beep(){
  if(!S.settings.sound) return;
  try{
    const C = new (window.AudioContext||window.webkitAudioContext)();
    [0,.18,.36].forEach((t,i) => {
      const o = C.createOscillator(), g = C.createGain();
      o.type = 'sine'; o.frequency.value = [660,880,1046][i];
      g.gain.setValueAtTime(.0001, C.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.22, C.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001, C.currentTime+t+.16);
      o.connect(g); g.connect(C.destination); o.start(C.currentTime+t); o.stop(C.currentTime+t+.2);
    });
    setTimeout(() => C.close(), 900);
  }catch(e){}
}

function modal(html, wide){
  el('modalHost').innerHTML = '<div class="ov" data-ov="1"><div class="modal'+(wide?' wide':'')+'">'+html+'</div></div>';
}
function closeModal(){ el('modalHost').innerHTML = ''; draft = null; tdraft = null; askCb = null; }
let askCb = null;
function ask(title, msg, label, cb){
  askCb = cb;
  modal('<div class="mh"><h3>'+title+'</h3><button class="x" data-act="close">'+ic('x')+'</button></div>'
    + '<div class="mb"><p style="margin:0;color:var(--text2);font-size:14.5px;line-height:1.62">'+msg+'</p></div>'
    + '<div class="mf"><button class="btn" data-act="close">Cancel</button>'
    + '<button class="btn danger" data-act="askYes" style="background:rgba(255,92,122,.14)">'+label+'</button></div>');
}
function toast(msg, kind){
  const d = document.createElement('div');
  d.className = 'toast ' + (kind||'');
  d.innerHTML = (kind === 'ok' ? '✅ ' : kind === 'err' ? '⚠️ ' : '') + esc(msg);
  el('toast').appendChild(d);
  setTimeout(() => { d.style.transition = '.3s'; d.style.opacity = '0'; d.style.transform = 'translateY(10px)'; setTimeout(() => d.remove(), 320); }, 2300);
}
function confetti(){
  const cv = el('confetti'), ctx = cv.getContext('2d');
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = COLORS.slice(0,9).map(c => c.hex);
  const parts = Array.from({length:130}, () => ({
    x: W/2 + (Math.random()-.5)*W*.7, y: H*.35 + (Math.random()-.5)*90,
    vx: (Math.random()-.5)*11, vy: Math.random()*-13 - 4,
    s: 5 + Math.random()*7, r: Math.random()*6.3, vr: (Math.random()-.5)*.34,
    c: cols[Math.floor(Math.random()*cols.length)], sq: Math.random() > .4
  }));
  let f = 0;
  (function frame(){
    ctx.clearRect(0,0,W,H); f++;
    parts.forEach(p => {
      p.vy += .38; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= .992;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - f/110); ctx.fillStyle = p.c;
      if(p.sq) ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);
      else { ctx.beginPath(); ctx.arc(0,0,p.s/2,0,7); ctx.fill(); }
      ctx.restore();
    });
    if(f < 115) requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H);
  })();
}

function applyTheme(){
  const t = S.settings.theme;
  const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  const root = document.documentElement;
  root.dataset.theme = dark ? 'dark' : 'light';
  const c = col(S.settings.accent);
  root.style.setProperty('--accent', c.hex);
  root.style.setProperty('--accentRGB', c.rgb);
  root.style.setProperty('--accent2', c.id === 'blue' ? '#7C5CFF' : c.id === 'violet' ? '#4DA6FF' : '#4DA6FF');
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.content = dark ? '#0A0C11' : '#F4F6FB';
}
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'momentum-backup-' + TODAY() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Backup downloaded', 'ok');
}
function copyJSON(){
  const txt = JSON.stringify(S);
  const fallback = () => {
    try{
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.top = '-999px'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy'); ta.remove();
      toast(ok ? 'JSON copied to clipboard' : 'Copy blocked — use Export backup', ok ? 'ok' : 'err');
    }catch(e){ toast('Copy blocked — use Export backup', 'err'); }
  };
  try{
    if(navigator && navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(() => toast('JSON copied to clipboard','ok'), fallback);
    else fallback();
  }catch(e){ fallback(); }
}
function importData(){
  const f = el('fileIn'); if(!f) return;
  f.onchange = () => {
    const file = f.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!d || !Array.isArray(d.habits)) throw 0;
        S = normalize(d);
        save(true); applyTheme(); resetScroll = true; render();
        toast('Backup restored — ' + S.habits.length + ' habits, ' + S.tasks.length + ' tasks', 'ok');
      }catch(e){ toast('That file is not a Momentum backup', 'err'); }
      f.value = '';
    };
    r.readAsText(file);
  };
  f.click();
}

let resetScroll = false;

    case 'inc': { const h = H(); setLog(h, k, getLog(h,k)+1); afterLog(h,k); break; }
    case 'dec': { const h = H(); setLog(h, k, Math.max(0, getLog(h,k)-1)); afterLog(h,k); break; }
    case 'toggleDay': { const h = H(); setLog(h, k, isDone(h,k) ? 0 : goalOf(h)); save(true); openHabit(id); render(); break; }

    case 'editHabit': editHabit(id); break;
    case 'menu': ui.menu = ui.menu === id ? null : id; render(); break;
    case 'move': {
      const i = S.habits.findIndex(x => x.id === id), j = i + (+btn.dataset.d);
      if(i < 0 || j < 0 || j >= S.habits.length) break;
      const tmp = S.habits[i]; S.habits[i] = S.habits[j]; S.habits[j] = tmp;
      ui.menu = id; save(true); render(); break; }
    case 'cat': ui.habitCat = btn.dataset.c; render(); break;
    case 'toggleArchived': ui.showArchived = !ui.showArchived; ui.habitCat = 'all'; render(); break;
    case 'archive': { const h = H(); h.archived = !h.archived; save(true); closeModal(); render(); toast(h.archived ? 'Archived' : 'Restored', 'ok'); break; }
    case 'delHabit': { const h = H(); if(!h) break;
      ask('Delete “'+esc(h.name)+'”?', 'This removes the habit and all '+totalDone(h)+' logged completions. Archiving keeps the history instead.', 'Delete forever', () => {
        S.habits = S.habits.filter(x => x.id !== id); delete S.logs[id]; save(true); render(); toast('Habit deleted');
      }); break; }
    case 'saveHabit': saveHabit(); break;
    case 'femoji': pullHabitForm(); draft.icon = btn.dataset.e; paintHabitForm(); break;
    case 'fcolor': pullHabitForm(); draft.color = btn.dataset.c; paintHabitForm(); break;
    case 'ftype': pullHabitForm(); draft.type = btn.dataset.t; if(draft.type==='count' && draft.target<2) draft.target = 8; paintHabitForm(); break;
    case 'ffreq': pullHabitForm(); draft.freq.t = btn.dataset.t; if(!draft.freq.days) draft.freq.days = [1,2,3,4,5]; paintHabitForm(); break;
    case 'fday': { pullHabitForm(); const d = +btn.dataset.d, arr = draft.freq.days || [];
      draft.freq.days = arr.includes(d) ? arr.filter(x => x !== d) : arr.concat(d); paintHabitForm(); break; }
    case 'seed': seed(); break;

    /* tasks */
    case 'addTask': addTaskFromInput(); break;
    case 'newTask': resetScroll = true; go('tasks'); setTimeout(() => { const i = el('qaTitle'); if(i) i.focus(); }, 80); break;
    case 'tdone': { const t = S.tasks.find(x => x.id === id); t.done = !t.done; t.doneAt = t.done ? TODAY() : '';
      save(true); render(); if(t.done) toast('Nice — task done', 'ok'); break; }
    case 'delTask': { const t = S.tasks.find(x => x.id === id); if(!t) break;
      S.tasks = S.tasks.filter(x => x.id !== id); save(true); closeModal(); render(); toast('Task deleted'); break; }
    case 'editTask': editTask(id); break;

    case 'tfilter': ui.taskFilter = btn.dataset.f; render(); break;
    case 'clearDone': ask('Clear completed tasks?', 'This permanently removes '+S.tasks.filter(t=>t.done).length+' completed tasks.', 'Clear them', () => {
      S.tasks = S.tasks.filter(t => !t.done); save(true); render(); toast('Cleared', 'ok'); }); break;
    case 'epri': pullTaskForm(); tdraft.pri = +btn.dataset.p; paintTaskForm(); break;
    case 'subAdd': pullTaskForm(); tdraft.sub.push({t:'',d:false}); paintTaskForm();
      setTimeout(() => { const l = document.querySelectorAll('[data-sub]'); if(l.length) l[l.length-1].focus(); }, 50); break;
    case 'subDel': pullTaskForm(); tdraft.sub.splice(+btn.dataset.i,1); paintTaskForm(); break;
    case 'subToggle': pullTaskForm(); tdraft.sub[+btn.dataset.i].d = !tdraft.sub[+btn.dataset.i].d; paintTaskForm(); break;

    case 'jprev': jSave(); ui.jDate = dk(addD(pd(ui.jDate),-1)); render(); break;

    case 'mood': { jSave(); const cur = S.notes[ui.jDate] || {text:'',mood:''};
      cur.mood = btn.dataset.m === cur.mood ? '' : btn.dataset.m;

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if(el('modalHost').innerHTML){ closeModal(); } return; }
  const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
  if(typing){
    if(e.key === 'Enter' && t.id === 'qaTitle'){ e.preventDefault(); addTaskFromInput(); }
    if(e.key === 'Enter' && (t.id === 'fName' || t.id === 'fUnit' || t.id === 'fTarget')){ e.preventDefault(); saveHabit(); }
    if(e.key === 'Enter' && (t.id === 'eTitle' || t.id === 'eTag')){ e.preventDefault(); saveTask(); }
    if((e.key === 's') && (e.metaKey || e.ctrlKey) && t.id === 'jText'){ e.preventDefault(); jSave(); toast('Saved','ok'); }
    return;
  }
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key);
  if(n >= 1 && n <= VIEWS.length){ resetScroll = true; go(VIEWS[n-1].id); return; }
  if(e.key.toLowerCase() === 'h'){ e.preventDefault(); editHabit(null); }
  if(e.key.toLowerCase() === 't'){ e.preventDefault(); resetScroll = true; go('tasks'); setTimeout(() => { const i = el('qaTitle'); if(i) i.focus(); }, 80); }
});

   backgrounded tab without ever firing beforeunload, so visibilitychange and
   pagehide are the ones that actually matter on mobile. */
function commit(){ try{ jSave(); flush(); save(true); saveSession(true); }catch(e){} }
window.addEventListener('beforeunload', commit);
window.addEventListener('pagehide', commit);
document.addEventListener('visibilitychange', () => { if(document.hidden) commit(); });

setInterval(() => {
  if(TODAY() !== lastDay){ lastDay = TODAY(); fired = {}; ui.jDate = TODAY(); window.__allDone = false; render(); }
  if(!S.settings.notify || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date(), hm = pad(now.getHours())+':'+pad(now.getMinutes());
  activeHabits().forEach(h => {
    const key = h.id + hm;
    if(h.reminder === hm && !fired[key] && dueToday(h) && !isDone(h, TODAY())){
      fired[key] = 1;
      try{ new Notification('Momentum · ' + h.name, { body: (h.icon||'✅') + '  ' + freqLabel(h) + ' — time to check it off.', tag: h.id }); }catch(e){}
    }
  });
}, 20000);

/* =========================================================
   BOOT
   ========================================================= */
(function boot(){
  const ICON = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C5CFF'/%3E%3Cstop offset='1' stop-color='%234DA6FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Cpath d='M27 51l15 15 31-32' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E";
  el('favicon').href = ICON;
  const man = { name:'Momentum — Habit Tracker', short_name:'Momentum', display:'standalone', orientation:'portrait',
    background_color:'#0A0C11', theme_color:'#0A0C11', start_url:'.', scope:'.',
    icons:[{ src:ICON, sizes:'any', type:'image/svg+xml', purpose:'any' }] };
  try{ el('manifest').href = 'data:application/json,' + encodeURIComponent(JSON.stringify(man)); }catch(e){}

  applyTheme();
  restoreSession();
  const list = todayList();
  window.__allDone = list.length > 0 && list.every(x => isDone(x, TODAY()));
  render();

  /* a focus session that ran out while the app was closed still counts */
  if(T.finishedWhileAway){
    T.finishedWhileAway = false;
    finishTimer(false);
    setTimeout(() => toast('Your focus session finished while the app was closed — logged', 'ok'), 900);
  }
  if(bootNotice){
    setTimeout(() => toast(DB.ok ? 'Check the notice at the top' : 'Not saving — see the notice at the top', 'err'), 600);
  } else if(!S.habits.length && !S.tasks.length){
    setTimeout(() => toast('Welcome to Momentum — press H to add your first habit', 'ok'), 700);
  }
  /* belt and braces: a periodic commit means even a hard kill loses nothing */
  setInterval(() => { flush(); saveSession(true); }, 15000);
})();
</script>
